name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0.2         # Spécifie la version MongoDB Docker
        ports:
          - 27017:27017            # Définit le port pour MongoDB

    steps:
      # Étape 1: Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Important pour SonarQube

      # Étape 2: Configuration de Java
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Étape 3: Nettoyer le Cache Maven (en cas de problèmes de dépendances)
      - name: Clear Maven Cache
        run: rm -rf ~/.m2/repository

      # Étape 4: Build et Tests (avec profil 'test' pour Spring)
      - name: Build and Run Tests
        env:
          SPRING_PROFILES_ACTIVE: test  # Assure que les tests utilisent le bon profil
          MONGO_URI: mongodb://localhost:27017/test  # Configuration nécessaire pour MongoDB
        run: |
          mvn clean verify -U \
          -Dspring.profiles.active=test

      # Étape 5: Analyse SonarQube
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
          -Dsonar.projectKey=elyroot94_BackendGp \
          -Dsonar.organization=elyroot94 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
          -Dsonar.analysis.mode=publish 

      # Étape 6: Déploiement sur le VPS
      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USERNAME }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/gestion-colis/"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TEST_SERVER_HOST }}
          username: ${{ secrets.TEST_SERVER_USERNAME }}
          key: ${{ secrets.TEST_SERVER_SSH_KEY }}
          script: |
            mkdir -p /opt/gestion-colis
            cd /opt/gestion-colis
            
            # Nettoyer les conteneurs existants
            docker compose down || true
            
            # Créer le fichier .env
            cat << EOF > .env
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            TAG=${{ github.sha }}
            MONGO_USERNAME=${{ secrets.MONGO_USERNAME }}
            MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
            EOF
            
            # Vérifier les variables (masquer les mots de passe sensibles)
            grep -v PASSWORD .env
            
            # Forcer le pull des images et recréer les conteneurs
            docker compose up --build
            
            # Vérifier le statut des conteneurs
            docker compose ps