spring.application.name=aichagp

# Configuration MongoDB pour les tests avec Testcontainers
spring.data.mongodb.uri=mongodb://localhost:${MONGODB_PORT}/test
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.repositories.type=auto

# Configuration des logs
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.testcontainers=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Configuration GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.schema.file-extensions=.graphqls
logging.level.org.springframework.context.annotation.AnnotationConfigApplicationContext=DEBUG

# Configuration du serveur
server.port=8080
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE