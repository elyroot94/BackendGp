# Configuration MongoDB embarqué
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=testdb

# Désactiver la journalisation MongoDB pour les tests
de.flapdoodle.embed.mongo.configuration.storage.journal.enabled=false

# Configuration de la version de MongoDB embarqué
de.flapdoodle.mongodb.embedded.version=5.0.5

# Désactiver les logs verbeux pendant les tests
logging.level.org.springframework.data.mongodb=INFO
logging.level.de.flapdoodle.embed.mongo=INFO 