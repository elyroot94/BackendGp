spring.application.name=aichagp

# Configuration MongoDB pour les tests
spring.data.mongodb.host=localhost
spring.data.mongodb.port=0
spring.data.mongodb.database=test

# Configuration de MongoDB embarqué
spring.mongodb.embedded.version=7.0.2
de.flapdoodle.mongodb.embedded.version=7.0.2
spring.data.mongodb.auto-index-creation=true

# Configuration des logs
logging.level.org.springframework.data.mongodb=INFO
logging.level.de.flapdoodle.embed.mongo=INFO

# Configuration GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.schema.file-extensions=.graphqls
logging.level.org.springframework.context.annotation.AnnotationConfigApplicationContext=DEBUG

# Configuration du serveur
server.port=8080